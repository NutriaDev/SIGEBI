version: '3.8'

services:

  ####################################
  # INFRAESTRUCTURA
  ####################################

  postgres:
    image: postgres:15
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    restart: unless-stopped
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    restart: unless-stopped
    depends_on:
      - kafka
    ports:
      - "9092:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: sigebi
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181

  ####################################
  # EUREKA
  ####################################

  eureka:
    build: ./eureka
    container_name: eureka
    restart: unless-stopped
    ports:
      - "8761:8761"

  ####################################
  # GATEWAY
  ####################################

  ms-gateway:
    build: ./gateway
    container_name: ms-gateway
    depends_on:
      - eureka
    ports:
      - "${PORT_GATEWAY:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      EUREKA_URL: http://eureka:8761/eureka
      AUTH_SERVICE_URL: http://ms-auth:8080
      USERS_SERVICE_URL: http://ms-users:8080
      EQUIPMENT_SERVICE_URL: http://ms-equipment:8080
      CMS_SERVICE_URL: http://ms-cms:8080
      INVENTORY_SERVICE_URL: http://ms-inventory:8080
      MAINTENANCE_SERVICE_URL: http://ms-maintenance:8080
      REPORTS_SERVICE_URL: http://ms-reportsandaudit:8080
      REDIS_HOST: redis
      REDIS_PORT: 6379

  ####################################
  # AUTH
  ####################################

  ms-auth:
    build: ./auth
    container_name: ms-auth
    depends_on:
      - postgres
      - eureka
      - redis
    ports:
      - "${PORT_AUTH:-9090}:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - EUREKA_URL=${EUREKA_URL}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME_AUTH}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}

  ####################################
  # USERS
  ####################################

  ms-users:
    build: ./users
    container_name: ms-users
    depends_on:
      - postgres
      - eureka
    ports:
      - "${PORT_USERS:-8090}:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - EUREKA_URL=${EUREKA_URL}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME_USERS}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}

  ####################################
  # EQUIPMENT
  ####################################

  ms-equipment:
    build: ./equipment
    container_name: ms-equipment
    depends_on:
      - postgres
      - eureka
      - kafka
    ports:
      - "${PORT_EQUIPMENT:-8091}:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - EUREKA_URL=${EUREKA_URL}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME_EQUIPMENT}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}

  ####################################
  # INVENTORY
  ####################################

  ms-inventory:
    build: ./inventory
    container_name: ms-inventory
    depends_on:
      - postgres
      - eureka
      - kafka
    ports:
      - "${PORT_INVENTORY:-8083}:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - EUREKA_URL=${EUREKA_URL}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME_INVENTORY}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}

  ####################################
  # MAINTENANCE
  ####################################

  ms-maintenance:
    build: ./maintenance
    container_name: ms-maintenance
    depends_on:
      - postgres
      - eureka
      - kafka
    ports:
      - "${PORT_MAINTENANCE:-8084}:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - EUREKA_URL=${EUREKA_URL}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME_MAINTENANCE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}

  ####################################
  # CMS
  ####################################

  ms-cms:
    build: ./cms
    container_name: ms-cms
    depends_on:
      - postgres
      - eureka
    ports:
      - "${PORT_CMS:-8082}:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - EUREKA_URL=${EUREKA_URL}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME_CMS}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
  ####################################
  # REPORTS & AUDIT
  ####################################

  ms-reportsandaudit:
    build: ./reportsandaudit
    container_name: ms-reportsandaudit
    depends_on:
      - postgres
      - kafka
      - eureka
    ports:
      - "${PORT_REPORTS:-8087}:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME_REPORTS}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}

      - EUREKA_URL=${EUREKA_URL}
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}

      - EQUIPMENT_SERVICE_URL=${EQUIPMENT_SERVICE_URL}
      - USER_SERVICE_URL=${USER_SERVICE_URL}
      - MAINTENANCE_SERVICE_URL=${MAINTENANCE_SERVICE_URL}

volumes:
  postgres_data: