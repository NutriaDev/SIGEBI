version: '3.8'

networks:
  sigebi-network:
    driver: bridge

volumes:
  postgres_data:
  zookeeper_data:
  kafka_data:

services:

  # ──────────────────────────────────────────────
  # INFRAESTRUCTURA
  # ──────────────────────────────────────────────

  postgres:
    image: postgres:15
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sigebi-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

#  db-init:
#    image: postgres:15
#    container_name: db-init
#    restart: "no"
#    env_file:
#      - .env
#    environment:
#      PGPASSWORD: ${DB_PASSWORD}
#    depends_on:
#      postgres:
#        condition: service_healthy
#    networks:
#      - sigebi-network
#    entrypoint: ["/bin/bash", "-c"]
#    command: >
#      psql -h postgres -U "${DB_USERNAME}" -d postgres -tc
#      "SELECT 1 FROM pg_database WHERE datname = '${DB_NAME_AUTH}'" | grep -q 1
#      || psql -h postgres -U "${DB_USERNAME}" -d postgres -c "CREATE DATABASE ${DB_NAME_AUTH}";
#      psql -h postgres -U "${DB_USERNAME}" -d postgres -tc
#      "SELECT 1 FROM pg_database WHERE datname = '${DB_NAME_USERS}'" | grep -q 1
#      || psql -h postgres -U "${DB_USERNAME}" -d postgres -c "CREATE DATABASE ${DB_NAME_USERS}";
#      psql -h postgres -U "${DB_USERNAME}" -d postgres -tc
#      "SELECT 1 FROM pg_database WHERE datname = '${DB_NAME_EQUIPMENT}'" | grep -q 1
#      || psql -h postgres -U "${DB_USERNAME}" -d postgres -c "CREATE DATABASE ${DB_NAME_EQUIPMENT}";
#      psql -h postgres -U "${DB_USERNAME}" -d postgres -tc
#      "SELECT 1 FROM pg_database WHERE datname = '${DB_NAME_MAINTENANCE}'" | grep -q 1
#      || psql -h postgres -U "${DB_USERNAME}" -d postgres -c "CREATE DATABASE ${DB_NAME_MAINTENANCE}";
#      psql -h postgres -U "${DB_USERNAME}" -d postgres -tc
#      "SELECT 1 FROM pg_database WHERE datname = '${DB_NAME_INVENTORY}'" | grep -q 1
#      || psql -h postgres -U "${DB_USERNAME}" -d postgres -c "CREATE DATABASE ${DB_NAME_INVENTORY}";
#      psql -h postgres -U "${DB_USERNAME}" -d postgres -tc
#      "SELECT 1 FROM pg_database WHERE datname = '${DB_NAME_CMS}'" | grep -q 1
#      || psql -h postgres -U "${DB_USERNAME}" -d postgres -c "CREATE DATABASE ${DB_NAME_CMS}";
#      psql -h postgres -U "${DB_USERNAME}" -d postgres -tc
#      "SELECT 1 FROM pg_database WHERE datname = '${DB_NAME_REPORTS}'" | grep -q 1
#      || psql -h postgres -U "${DB_USERNAME}" -d postgres -c "CREATE DATABASE ${DB_NAME_REPORTS}"

  redis:
    image: redis:7
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - sigebi-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
    networks:
      - sigebi-network
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - sigebi-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8088:8088"
    environment:
      KAFKA_CLUSTERS_0_NAME: sigebi
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - sigebi-network

  # ──────────────────────────────────────────────
  # EUREKA (Service Discovery)
  # ──────────────────────────────────────────────

  eureka:
    image: ms-eureka:latest
    container_name: eureka
    restart: unless-stopped
    ports:
      - "${PORT_EUREKA}:${PORT_EUREKA}"
    env_file:
      - .env
    environment:
      PORT: ${PORT_EUREKA}
    networks:
      - sigebi-network

  # ──────────────────────────────────────────────
  # AUTH
  # ──────────────────────────────────────────────

  ms-auth:
    image: ms-auth:latest
    container_name: ms-auth
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      eureka:
        condition: service_started
    ports:
      - "${PORT_AUTH}:${PORT_AUTH}"
    env_file:
      - .env
    environment:
      PORT: ${PORT_AUTH}
      DB_NAME: ${DB_NAME_AUTH}
    networks:
      - sigebi-network

  # ──────────────────────────────────────────────
  # USERS
  # ──────────────────────────────────────────────

  ms-users:
    image: ms-users:latest
    container_name: ms-users
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      eureka:
        condition: service_started
    ports:
      - "${PORT_USERS}:${PORT_USERS}"
    env_file:
      - .env
    environment:
      PORT: ${PORT_USERS}
      DB_NAME: ${DB_NAME_USERS}
    networks:
      - sigebi-network

  # ──────────────────────────────────────────────
  # CMS
  # ──────────────────────────────────────────────

  ms-cms:
    image: ms-cms:latest
    container_name: ms-cms
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      eureka:
        condition: service_started
    ports:
      - "${PORT_CMS}:${PORT_CMS}"
    env_file:
      - .env
    environment:
      PORT: ${PORT_CMS}
      DB_NAME: ${DB_NAME_CMS}
    networks:
      - sigebi-network

  # ──────────────────────────────────────────────
  # EQUIPMENT
  # ──────────────────────────────────────────────

  ms-equipments:
    image: ms-equipments:latest
    container_name: ms-equipments
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      eureka:
        condition: service_started
      kafka:
        condition: service_started

    ports:
      - "${PORT_EQUIPMENT}:${PORT_EQUIPMENT}"
    env_file:
      - .env
    environment:
      PORT: ${PORT_EQUIPMENT}
      DB_NAME: ${DB_NAME_EQUIPMENT}
    networks:
      - sigebi-network

  # ──────────────────────────────────────────────
  # MAINTENANCE
  # ──────────────────────────────────────────────

  ms-maintenance:
    image: ms-maintenance:latest
    container_name: ms-maintenance
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      eureka:
        condition: service_started
      kafka:
        condition: service_started
    ports:
      - "${PORT_MAINTENANCE}:${PORT_MAINTENANCE}"
    env_file:
      - .env
    environment:
      PORT: ${PORT_MAINTENANCE}
      DB_NAME: ${DB_NAME_MAINTENANCE}
    networks:
      - sigebi-network

  # ──────────────────────────────────────────────
  # INVENTORY
  # ──────────────────────────────────────────────

  ms-inventory:
    image: ms-inventory:latest
    container_name: ms-inventory
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      eureka:
        condition: service_started
      kafka:
        condition: service_started
    ports:
      - "${PORT_INVENTORY}:${PORT_INVENTORY}"
    env_file:
      - .env
    environment:
      PORT: ${PORT_INVENTORY}
      DB_NAME: ${DB_NAME_INVENTORY}
    networks:
      - sigebi-network

  # ──────────────────────────────────────────────
  # REPORTS & AUDIT
  # ──────────────────────────────────────────────

  ms-reportsandaudit:
    image: ms-reportsandaudit:latest
    container_name: ms-reportsandaudit
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      eureka:
        condition: service_started
      kafka:
        condition: service_started
    ports:
      - "${PORT_REPORTS}:${PORT_REPORTS}"
    env_file:
      - .env
    environment:
      PORT: ${PORT_REPORTS}
      DB_NAME: ${DB_NAME_REPORTS}
    networks:
      - sigebi-network

  # ──────────────────────────────────────────────
  # GATEWAY
  # ──────────────────────────────────────────────

  ms-gateway:
    image: ms-gateway:latest
    container_name: ms-gateway
    restart: unless-stopped
    depends_on:
      eureka:
        condition: service_started
      redis:
        condition: service_healthy
    ports:
      - "${PORT_GATEWAY}:${PORT_GATEWAY}"
    env_file:
      - .env
    environment:
      PORT: ${PORT_GATEWAY}
    networks:
      - sigebi-network
