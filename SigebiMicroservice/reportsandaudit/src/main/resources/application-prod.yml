server:
  port: ${PORT_REPORTS:8087}

spring:
  application:
    name: ms-reportsandaudit

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  sql:
    init:
      mode: never

  data:
    web:
      pageable:
        default-page-size: 10
        max-page-size: 100

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

    consumer:
      group-id: sigebi-report-group
      auto-offset-reset: earliest
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: >
          sigebi.reportsandaudit.kafka,
          sigebi.maintenance.kafka,
          inventory.kafka,
          equipment.kafka
        spring.json.type.mapping: >
          sigebi.maintenance.kafka.ReportEvent:sigebi.reportsandaudit.kafka.ReportEvent,
          inventory.kafka.MovementEvent:sigebi.reportsandaudit.kafka.MovementEvent,
          inventory.kafka.InventoryEvent:sigebi.reportsandaudit.kafka.InventoryEvent,
          equipment.kafka.EquipmentEvent:sigebi.reportsandaudit.kafka.EquipmentEvent

eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.value}

  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_URL}

feign:
  httpclient:
    enabled: true

kafka:
  topics:
    audit-events: sigebi-audit-events
    report-events: sigebi-report-events
    movement-events: sigebi-movement-events
    inventory-events: sigebi-inventory-events
    service-report-events: sigebi-service-report-events
    equipment-events: sigebi-equipment-events

equipment-service:
  url: ${EQUIPMENT_SERVICE_URL}

user-service:
  url: ${USER_SERVICE_URL}

maintenance-service:
  url: ${MAINTENANCE_SERVICE_URL}

reports:
  maintenance:
    pdf-directory: ${REPORTS_DIRECTORY:./reports/maintenance}